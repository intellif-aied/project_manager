# Codex publication contract:
# 1. Read production provider/raw_model and earliest activity_date first.
# 2. Stop if an observed model is absent from both alias_candidates and
#    excluded_models, or if activity starts before 2026-07-01.
# 3. Create one draft price book, publish aliases/rates/prices through Admin API, then activate it.
# 4. Never copy UUIDs, created_by, published_by, or rows from the test database.
# 5. Run recalculation preview before apply. Apply only after an operator approves the counts.

price_book:
  name: "AIDA 官方 API 等价价格 2026-07-15"
  source_currency: "USD"
  display_currency: "CNY"
  initial_status: "draft"

publication:
  admin_api_base: "/api/v1/admin"
  execution_mode: "existing Admin API only; do not edit production pricing tables directly"
  endpoints:
    price_books: "POST /price-books"
    model_aliases: "POST /model-aliases"
    exchange_rates: "POST /exchange-rate-versions"
    model_prices: "POST /model-price-versions"
    preview: "POST /pricing/recalculate/preview"
    apply: "POST /pricing/recalculate/apply"
  preflight_sql_intent:
    - "List distinct active provider + raw_model and token totals from session_usage_components."
    - "Find the earliest activity_date requiring pricing."
    - "List existing active price books and published overlapping price/rate versions."
  stop_conditions:
    - "An observed provider/raw_model is absent from both alias_candidates and excluded_models."
    - "Required activity_date is earlier than this manifest's supported date range."
    - "A published overlapping interval has a different value."
    - "GLM cost is required as exact native-CNY billing rather than phase-one USD-equivalent estimation."

# Alias lookup is exact, not regex or wildcard. Publish only rows whose exact
# provider + raw_model pair is observed in production. provider identifies the
# session client (codex or claude_code), not the model vendor.
