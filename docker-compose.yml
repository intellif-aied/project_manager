services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aidashboard
      POSTGRES_USER: aidashboard
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    expose:
      - "9091"
    environment:
      DATABASE_URL: "postgres://aidashboard:devpassword@db:5432/aidashboard?sslmode=disable"
      JWT_SECRET: "dev-jwt-secret-change-in-prod"
      AI_API_URL: ""
      AI_API_KEY: ""
      AI_MODEL: ""
      AIHUB_HOST: "${AIHUB_HOST}"
      AIHUB_TOKEN: "${AIHUB_TOKEN}"
      AIHUB_SECRET: "${AIHUB_SECRET}"
      AI_GATEWAY_MODELS_URL: "${AI_GATEWAY_MODELS_URL:-http://192.168.11.18:30054/api/v2/models}"
      AIDA_BOOTSTRAP_ADMIN_UIDS: "${AIDA_BOOTSTRAP_ADMIN_UIDS:-1066}"
      CORS_ORIGIN: "http://localhost:3000,http://192.168.28.113:3000"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
      MINIO_BUCKET: "aidashboard"
      MINIO_USE_SSL: "false"
      MINIO_EXTERNAL_ENDPOINT: "http://localhost:9000"
      MANAGED_AGENT_URL: "${MANAGED_AGENT_URL:-}"
      MANAGED_AGENT_TOKEN: "${MANAGED_AGENT_TOKEN:-}"
      MANAGED_AGENT_DEFAULT_ENGINE: "${MANAGED_AGENT_DEFAULT_ENGINE:-claude-code}"
      MANAGED_AGENT_DEFAULT_MODEL_ID: "${MANAGED_AGENT_DEFAULT_MODEL_ID:-MiniMax-M2.5}"
      MANAGED_AGENT_REPORT_MODEL_ID: "${MANAGED_AGENT_REPORT_MODEL_ID:-deepseek-v4-flash}"
      MANAGED_AGENT_REPORT_SKILL_OWNER: "${MANAGED_AGENT_REPORT_SKILL_OWNER:-100866}"
      MANAGED_AGENT_REPORT_SKILL_VERSION: "${MANAGED_AGENT_REPORT_SKILL_VERSION:-}"
      MANAGED_AGENT_REPORT_MCP_URL: "${MANAGED_AGENT_REPORT_MCP_URL:-}"
      PROJECT_MEMORY_NIGHTLY_ENABLED: "${PROJECT_MEMORY_NIGHTLY_ENABLED:-false}"
      PROJECT_MEMORY_AGENT_ID: "${PROJECT_MEMORY_AGENT_ID:-}"
      PROJECT_MEMORY_MODEL_ID: "${PROJECT_MEMORY_MODEL_ID:-deepseek-v4-flash}"
      PROJECT_MEMORY_SKILL_OWNER: "${PROJECT_MEMORY_SKILL_OWNER:-}"
      PROJECT_MEMORY_SKILL_VERSION: "${PROJECT_MEMORY_SKILL_VERSION:-}"
      PROJECT_MEMORY_MCP_URL: "${PROJECT_MEMORY_MCP_URL:-}"
      PROJECT_MEMORY_START_HOUR: "${PROJECT_MEMORY_START_HOUR:-2}"
      PROJECT_MEMORY_END_HOUR: "${PROJECT_MEMORY_END_HOUR:-6}"
      REPORT_REVIEW_ENABLED: "${REPORT_REVIEW_ENABLED:-false}"
      REPORT_REVIEW_AGENT_ID: "${REPORT_REVIEW_AGENT_ID:-}"
      REPORT_REVIEW_MODEL_ID: "${REPORT_REVIEW_MODEL_ID:-MiniMax-M2.5}"
      REPORT_REVIEW_SKILL_OWNER: "${REPORT_REVIEW_SKILL_OWNER:-}"
      REPORT_REVIEW_SKILL_VERSION: "${REPORT_REVIEW_SKILL_VERSION:-}"
      REPORT_REVIEW_MCP_URL: "${REPORT_REVIEW_MCP_URL:-}"
      REPORT_TWO_PASS_ENABLED: "${REPORT_TWO_PASS_ENABLED:-false}"
      REPORT_EMAIL_ENABLED: "${REPORT_EMAIL_ENABLED:-}"
      REPORT_EMAIL_ADDRESS: "${REPORT_EMAIL_ADDRESS:-}"
      REPORT_EMAIL_PASSWORD: "${REPORT_EMAIL_PASSWORD:-}"
      REPORT_EMAIL_TIME_OF_DAY: "${REPORT_EMAIL_TIME_OF_DAY:-08:00}"
      AIDA_PUBLIC_BASE_URL: "${AIDA_PUBLIC_BASE_URL:-}"
      AIDA_INTERNAL_METRICS_ADDR: "${AIDA_INTERNAL_METRICS_ADDR:-:9091}"
      AIDA_CLAUDE_CACHE_WRITE_VARIANT: "${AIDA_CLAUDE_CACHE_WRITE_VARIANT:-}"
      REPORT_RUN_PROCESSOR_COUNT: "${REPORT_RUN_PROCESSOR_COUNT:-20}"
      DIGEST_BACKGROUND_WORKER_COUNT: "${DIGEST_BACKGROUND_WORKER_COUNT:-20}"
      DIGEST_INTERACTIVE_WORKER_COUNT: "${DIGEST_INTERACTIVE_WORKER_COUNT:-20}"
      TZ: "${TZ:-Asia/Shanghai}"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      AIHUB_RUNTIME_CONFIG_apiBaseUrl: "/api/v1"
      AIHUB_RUNTIME_CONFIG_authApiBaseUrl: "/api/v1"
      AIHUB_RUNTIME_CONFIG_userApiBaseUrl: "/api/v1"
      AIHUB_RUNTIME_CONFIG_appTitle: "AIDashboard"
    depends_on:
      - api

volumes:
  pgdata:
  minio_data:
